<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mocap 动作总线</title>
<style>body{margin:0;background:#0e1523;color:#edf4ff;font:16px system-ui,"Microsoft YaHei"}main{max-width:1000px;margin:64px auto;padding:0 28px}h1{font-size:34px;margin-bottom:10px}.muted{color:#a4b2c9}.cards{display:flex;gap:20px;margin:30px 0}.card,table{background:#192438;border-radius:12px}.card{padding:24px;flex:1}.big{font-size:28px;color:#58debe;margin-top:10px}table{width:100%;border-collapse:collapse;overflow:hidden}td,th{padding:17px 20px;text-align:left;border-bottom:1px solid #29354a}code{color:#58debe}#err{color:#ff9d9d}.flow{padding:24px 0;color:#c8d7eb}.dot{color:#58debe}footer{margin-top:25px;line-height:1.8}</style>
<main><h1>Mocap 动作总线</h1><div class="muted">一个动作源，多个角色独立订阅。</div>
<div class="flow">AGI Mocap → <code>agi/main</code> → 所有在线角色</div>
<div id="err"></div><div class="cards"><div class="card">发布端<div class="big" id="source">连接中…</div><div class="muted" id="input"></div></div><div class="card">在线订阅<div class="big" id="count">—</div></div><div class="card">收到的数据包<div class="big" id="packets">—</div></div></div>
<table><thead><tr><th>角色</th><th>接收端口</th><th>已转发</th><th>心跳有效期</th></tr></thead><tbody id="rows"></tbody></table>
<footer class="muted">启动角色后会自动订阅，关闭后自动退订。AGI 的发送端口保持 39539。<br>这里只转发本机实时数据；各角色的材质、动作映射和物理独立运行。</footer></main>
<script>
const $=id=>document.getElementById(id);
async function update(){try{const r=await fetch('/api/status',{cache:'no-store'});if(!r.ok)throw Error(r.status);const d=await r.json();$('err').textContent='';$('source').textContent=d.source_active?'● 正在发布':'等待 AGI 数据';$('input').textContent=`127.0.0.1:${d.input_port} · ${d.topic}`;$('count').textContent=d.subscribers.length;$('packets').textContent=d.received_packets.toLocaleString();$('rows').replaceChildren();for(const s of d.subscribers){const tr=document.createElement('tr');for(const val of [s.name,s.port,s.forwarded_packets.toLocaleString(),s.lease_seconds_left+' 秒']){const td=document.createElement('td');td.textContent=val;tr.appendChild(td)}$('rows').appendChild(tr)}if(!d.subscribers.length){const tr=document.createElement('tr'),td=document.createElement('td');td.colSpan=4;td.textContent='还没有角色订阅。打开薇斯纳或沃雅妮莎的启动入口即可。';tr.appendChild(td);$('rows').appendChild(tr)}}catch(e){$('err').textContent='总线暂时未连接。角色启动后会自动重连。'}}update();setInterval(update,1000);
</script></html>
